[project]
name = "halflife"
version = "0.1.0"
description = "Drive-failure prediction on Backblaze Drive Stats."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "typer",
]

[project.scripts]
halflife = "halflife.cli:app"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
